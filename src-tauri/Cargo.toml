[package]
name = "plinky-desktop"
version = "0.1.0"
description = "Plinky - Modern PuTTY Wrapper & Terminal Workbench"
edition = "2021"

[lib]
name = "plinky_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
putty-compat = { path = "../crates/putty-compat" }
plinky-core = { path = "../crates/plinky-core" }
tokio = { version = "1.38", features = ["full"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
