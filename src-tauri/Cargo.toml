[package]
name = "plinky-desktop"
version = "0.1.2"
description = "Plinky - Modern PuTTY Wrapper & Terminal Workbench"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "plinky_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Native Save As dialog (vault export to KeePass) -- owner-approved.
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
putty-compat = { path = "../crates/putty-compat", version = "0.1.0" }
plinky-core = { path = "../crates/plinky-core", version = "0.1.0" }
tokio = { version = "1.38", features = ["full"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
