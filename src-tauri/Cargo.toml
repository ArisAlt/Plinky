[package]
name = "plinky-desktop"
version = "0.1.23"
description = "Plinky - a terminal and session manager built on PuTTY"
edition = "2021"
license = "GPL-3.0-only"
# Part of the Plinky app, not a library for crates.io.
publish = false

[lib]
name = "plinky_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Native Save As dialog (vault export to KeePass).
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
putty-compat = { path = "../crates/putty-compat", version = "0.1.0" }
plinky-core = { path = "../crates/plinky-core", version = "0.1.0" }
tokio = { version = "1.38", features = ["full"] }
# Clipboard read/write in the backend -- owner-approved. The webview blocks the
# page from reading the clipboard (wry keeps clipboard access off), so paste
# from other programs failed on Linux and Windows.
tauri-plugin-clipboard-manager = "2"

# geteuid: the GNS3 handoff socket is used only when this user owns it
# (handoff.rs). Already in Cargo.lock through tauri.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
