name: Release Thyrion

on:
  push:
    tags:
      - 'v*'
  # Build and publish from the Actions tab (or the API) without pushing a
  # tag: the release step creates the tag on the chosen commit.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, e.g. v0.1.4-rc.1'
        required: true
      prerelease:
        description: 'Publish as a pre-release'
        type: boolean
        default: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  # A pushed tag with a suffix (v0.1.4-rc.1) is a pre-release; a manual run
  # says so itself.
  PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || contains(github.ref_name, '-') }}

jobs:
  release-linux:
    name: Build & Release Linux (AppImage, deb, rpm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies & PuTTY
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            putty-tools \
            openssh-server

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri Desktop Bundles
        run: |
          NO_STRIP=true npx tauri build

      # The bundled Ubuntu libwayland made newer Mesa abort with
      # EGL_BAD_PARAMETER: a grey window (see the script's header).
      - name: Drop bundled libwayland from the AppImage
        run: |
          for f in target/release/bundle/appimage/*.AppImage; do
            scripts/appimage-drop-wayland.sh "$f"
          done

      - name: Upload Release Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ env.PRERELEASE }}
          files: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-windows:
    name: Build & Release Windows (MSI, EXE)
    runs-on: windows-latest
    # The Linux job creates the release (and, on a manual run, the tag);
    # two jobs creating the same release at once can race.
    needs: release-linux
    env:
      # Windows code signing through SignPath (free for open-source projects).
      # With no token the release is built unsigned, as before. The token is
      # a secret; the organization id and slugs are repository variables.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG || 'thyrion' }}
      SIGNPATH_POLICY_SLUG: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PuTTY
        run: choco install putty -y

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # Unsigned: one step, as before.
      - name: Build Tauri Desktop Bundles
        if: env.SIGNPATH_API_TOKEN == ''
        run: npx tauri build

      # Signed: the installers carry thyrion.exe inside them, so the program
      # is signed first and the installers are built around the signed one,
      # then signed themselves. Signing only the finished installers would
      # leave the program they install unsigned.
      - name: Build the program (signed release)
        if: env.SIGNPATH_API_TOKEN != ''
        run: npx tauri build --no-bundle

      - name: Collect the program for signing
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path to-sign/program | Out-Null
          Copy-Item target/release/thyrion.exe to-sign/program/thyrion.exe

      - name: Upload the program for signing
        if: env.SIGNPATH_API_TOKEN != ''
        id: program-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: program-unsigned
          path: to-sign/program/

      - name: Sign the program (SignPath)
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: program
          github-artifact-id: ${{ steps.program-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/program

      - name: Put the signed program back and build the installers around it
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          Copy-Item signed/program/thyrion.exe target/release/thyrion.exe -Force
          npx tauri bundle
          # tauri bundle must package the program as it is, not rebuild it.
          $sig = Get-AuthenticodeSignature target/release/thyrion.exe
          if ($sig.Status -ne 'Valid') { throw "thyrion.exe is not signed after bundling: $($sig.Status)" }

      - name: Collect the installers for signing
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path to-sign/installers | Out-Null
          Copy-Item target/release/bundle/msi/*.msi to-sign/installers/
          Copy-Item target/release/bundle/nsis/*.exe to-sign/installers/

      - name: Upload the installers for signing
        if: env.SIGNPATH_API_TOKEN != ''
        id: installers-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: installers-unsigned
          path: to-sign/installers/

      - name: Sign the installers (SignPath)
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.installers-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/installers

      - name: Put the signed installers back
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          Copy-Item signed/installers/*.msi target/release/bundle/msi/ -Force
          Copy-Item signed/installers/*.exe target/release/bundle/nsis/ -Force
          foreach ($f in Get-ChildItem target/release/bundle/msi/*.msi, target/release/bundle/nsis/*.exe) {
            $sig = Get-AuthenticodeSignature $f.FullName
            if ($sig.Status -ne 'Valid') { throw "$($f.Name) is not signed: $($sig.Status)" }
            Write-Host "$($f.Name): signed by $($sig.SignerCertificate.Subject)"
          }

      - name: Package Portable Windows Archive
        shell: pwsh
        run: |
          $exePath = if (Test-Path "target/release/thyrion.exe") { "target/release/thyrion.exe" } elseif (Test-Path "src-tauri/target/release/thyrion.exe") { "src-tauri/target/release/thyrion.exe" } else { Get-ChildItem -Path target,src-tauri -Filter "thyrion.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName }
          New-Item -ItemType Directory -Force -Path "release-portable"
          Copy-Item $exePath -Destination "release-portable/Thyrion.exe"
          Copy-Item "README.md" -Destination "release-portable/README.md" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "dist-release"
          Compress-Archive -Path "release-portable/*" -DestinationPath "dist-release/Thyrion_${{ env.RELEASE_TAG }}_x64_portable.zip"
          Copy-Item $exePath -Destination "dist-release/Thyrion-Portable.exe"

      - name: Upload Release Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ env.PRERELEASE }}
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            dist-release/Thyrion_${{ env.RELEASE_TAG }}_x64_portable.zip
            dist-release/Thyrion-Portable.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

