name: Release Plinky

on:
  push:
    tags:
      - 'v*'
  # Build and publish from the Actions tab (or the API) without pushing a
  # tag: the release step creates the tag on the chosen commit.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, e.g. v0.1.4-rc.1'
        required: true
      prerelease:
        description: 'Publish as a pre-release'
        type: boolean
        default: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  # A pushed tag with a suffix (v0.1.4-rc.1) is a pre-release; a manual run
  # says so itself.
  PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || contains(github.ref_name, '-') }}

jobs:
  release-linux:
    name: Build & Release Linux (AppImage, deb, rpm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies & PuTTY
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            putty-tools \
            openssh-server

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri Desktop Bundles
        run: |
          NO_STRIP=true npx tauri build

      # The bundled Ubuntu libwayland made newer Mesa abort with
      # EGL_BAD_PARAMETER: a grey window (see the script's header).
      - name: Drop bundled libwayland from the AppImage
        run: |
          for f in target/release/bundle/appimage/*.AppImage; do
            scripts/appimage-drop-wayland.sh "$f"
          done

      - name: Upload Release Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ env.PRERELEASE }}
          files: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-windows:
    name: Build & Release Windows (MSI, EXE)
    runs-on: windows-latest
    # The Linux job creates the release (and, on a manual run, the tag);
    # two jobs creating the same release at once can race.
    needs: release-linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PuTTY
        run: choco install putty -y

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri Desktop Bundles
        run: npx tauri build

      - name: Package Portable Windows Archive
        shell: pwsh
        run: |
          $exePath = if (Test-Path "target/release/plinky-desktop.exe") { "target/release/plinky-desktop.exe" } elseif (Test-Path "src-tauri/target/release/plinky-desktop.exe") { "src-tauri/target/release/plinky-desktop.exe" } else { Get-ChildItem -Path target,src-tauri -Filter "plinky-desktop.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName }
          New-Item -ItemType Directory -Force -Path "release-portable"
          Copy-Item $exePath -Destination "release-portable/Plinky.exe"
          Copy-Item "README.md" -Destination "release-portable/README.md" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "dist-release"
          Compress-Archive -Path "release-portable/*" -DestinationPath "dist-release/Plinky_${{ env.RELEASE_TAG }}_x64_portable.zip"
          Copy-Item $exePath -Destination "dist-release/Plinky-Portable.exe"

      - name: Upload Release Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ env.PRERELEASE }}
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            dist-release/Plinky_${{ env.RELEASE_TAG }}_x64_portable.zip
            dist-release/Plinky-Portable.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

