name: Thyrion CI Matrix

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Tests read the code and nothing else (CodeQL: actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  test-linux:
    name: Linux (Ubuntu) - Test, Build, Deny & Smoke
    runs-on: ubuntu-latest
    # A hung test used to hold the job until GitHub's 6 h limit.
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies & PuTTY
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            putty-tools \
            openssh-server \
            xvfb

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Verify Frontend Compilation
        run: npm run build

      - name: Run Cargo Workspace Tests
        run: cargo test --workspace --verbose --no-fail-fast

      - name: Install & Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: Build Desktop Application Binary
        run: cargo build -p thyrion

      - name: Headless Desktop Launch Smoke Test (Xvfb)
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" timeout 8s ./target/debug/thyrion || exit_code=$?
          # Exit code 124 indicates timeout killed the running process cleanly, proving zero panics on launch
          if [ "${exit_code:-0}" -eq 124 ] || [ "${exit_code:-0}" -eq 0 ]; then
            echo "Smoke test passed: application stayed alive under Xvfb with zero launch panics."
          else
            echo "Smoke test failed with unexpected exit code: $exit_code"
            exit 1
          fi

  test-windows:
    name: Windows - Test & Build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PuTTY
        run: choco install putty -y

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Verify Frontend Compilation
        run: npm run build

      - name: Run Cargo Workspace Tests
        run: cargo test --workspace --verbose --no-fail-fast

  # The real app, its backend and PuTTY's plink, driven through WebKit's
  # inspector against stand-in router consoles, a private sshd and a socat
  # serial line (e2e/run.mjs). Unit tests stub those joins; this suite is
  # what caught the bugs in them, and it ran only by hand until a timing
  # regression sat unnoticed through two releases.
  e2e-linux:
    name: Linux - End-to-end (real app, Xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies, PuTTY, sshd, socat, Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            putty-tools \
            openssh-server \
            socat \
            xvfb

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: e2e

      # The suite needs Node 22+: it talks to the inspector with the
      # built-in WebSocket.
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # --build makes the debug app with the page embedded (`tauri build
      # --debug`); a plain cargo build shows a blank window without Vite.
      - name: Run the end-to-end suite
        env:
          TMPDIR: ${{ runner.temp }}/e2e
        run: |
          mkdir -p "$TMPDIR"
          npm run e2e -- --build --keep

      - name: Keep the app logs and profiles of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-profiles
          path: |
            ${{ runner.temp }}/e2e/thyrion-e2e-*/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  # The same suite on Windows: WebView2 driven over its DevTools port,
  # sessions in the registry, plink in a pseudo console. Each scenario
  # clears the registry sessions and Thyrion's data folders first, which
  # lib/windows.mjs allows only on a CI runner. No sshd or socat here, so
  # the SSH and serial scenarios skip.
  e2e-windows:
    name: Windows - End-to-end (real app, WebView2)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PuTTY
        run: |
          choco install putty -y
          echo "C:\Program Files\PuTTY" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: e2e

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Run the end-to-end suite
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "e2e"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $env:TEMP = $dir
          $env:TMP = $dir
          plink -V
          npm run e2e -- --build --keep

      - name: Keep the app logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-profiles-windows
          path: ${{ runner.temp }}/e2e/thyrion-e2e-*/**/*.log
          if-no-files-found: ignore
          retention-days: 7
