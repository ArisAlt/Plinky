[package]
name = "putty-compat"
version = "0.1.0"
edition = "2021"
description = "PuTTY compatibility layer: session r/w, .ppk header inspection & fingerprinting, hostkeys"
license = "GPL-3.0-only"
# Part of the Plinky app, not a library for crates.io.
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
base64 = "0.22"
sha2 = "0.10"
tempfile = "3.16"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3.16"
