[package]
name = "plinky-core"
version = "0.1.0"
edition = "2021"
description = "Core terminal engine, PTY lifecycle, pre-auth state machine, and connection registry for Plinky"

[dependencies]
portable-pty = "0.8"
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
regex = "1.10"
putty-compat = { path = "../putty-compat" }
argon2 = "0.5"
aes-gcm = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
rand = "0.8"

[dev-dependencies]
tempfile = "3.10"
