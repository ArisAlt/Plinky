[package]
name = "plinky-core"
version = "0.1.0"
edition = "2021"
description = "Core terminal engine, PTY lifecycle, pre-auth state machine, and connection registry for Plinky"
license = "GPL-3.0-only"
# Part of the Plinky app, not a library for crates.io.
publish = false

[dependencies]
portable-pty = "0.8"
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
regex = "1.10"
putty-compat = { path = "../putty-compat", version = "0.1.0" }
argon2 = "0.5"
aes-gcm = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
rand = "0.8"
# ADR-005: native serial transport. default-features off: skips the libudev
# link (port enumeration), so no new system library for the AppImage.
serialport = { version = "4.10", default-features = false }
tempfile = "3.10"
# Export the vault to a KeePass (KDBX4) database.
keepass = { version = "0.15", features = ["save_kdbx4"] }

[target.'cfg(windows)'.dependencies]
# Overlapped serial I/O, as PuTTY does it (transport/serial.rs). The version
# serialport already uses, so nothing new is downloaded.
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Devices_Communication",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
# Reads and sets the pty's termios (character mode for telnet/raw consoles).
libc = "0.2"

[dev-dependencies]
