[package]
name = "plinky-core"
version = "0.1.0"
edition = "2021"
description = "Core terminal engine, PTY lifecycle, pre-auth state machine, and connection registry for Plinky"
license = "MIT OR Apache-2.0"

[dependencies]
portable-pty = "0.8"
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
regex = "1.10"
putty-compat = { path = "../putty-compat", version = "0.1.0" }
argon2 = "0.5"
aes-gcm = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
rand = "0.8"
# ADR-005: native serial transport. default-features off: skips the libudev
# link (port enumeration), so no new system library for the AppImage.
serialport = { version = "4.10", default-features = false }
tempfile = "3.10"
# Export the vault to a KeePass (KDBX4) database -- owner-approved dependency.
keepass = { version = "0.15", features = ["save_kdbx4"] }

[dev-dependencies]
